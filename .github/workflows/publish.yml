name: publish

# Trusted publishing (OIDC). No NPM_TOKEN, no 2FA prompt, no long-lived secret
# anywhere in this repo — npm verifies the identity of THIS workflow in THIS
# repository and issues a short-lived credential for the publish itself.
#
# npm cannot attach a trusted publisher to a package that does not exist, so
# version 0.1.0 is bootstrapped with a local `npm publish`. Everything after it
# goes through here and carries a provenance attestation automatically.
#
# The npm side must match this file exactly:
#   npmjs.com -> package -> Settings -> Trusted Publisher -> GitHub Actions
#     Organization or user: ca1773130n
#     Repository:           Mischief
#     Workflow filename:    publish.yml
#     Environment:          (leave empty — this workflow declares none)

on:
  release:
    types: [published]
  # Manual runs ALWAYS dry-run. A publish is only ever triggered by cutting a
  # release, so there is no combination of clicks in the Actions UI that ships a
  # version by accident — the first draft of this file defaulted a `dry_run`
  # input to false, which made "Run workflow" on a whim a real publish.
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # The whole mechanism. Without id-token: write the runner cannot mint the
      # OIDC token and npm falls back to asking for credentials it will not get.
      id-token: write
      contents: read
    steps:
      # v7 for both: v4 runs on the Node 20 action runtime, which GitHub has
      # deprecated and is already force-running on Node 24 with a warning. These
      # majors declare `using: node24` natively.
      #
      # Checked before bumping, because setup-node has broken publishing here
      # before (see "Stop setup-node from silently disabling OIDC"): the breaking
      # changes across v5/v6/v7 are all about automatic dependency caching, none
      # touch registry-url or .npmrc. Auto-caching keys on a `packageManager`
      # field this package does not have, so it does not engage either.
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # The suite runs on node:test's --test glob, which needs >= 21, while
          # the package itself supports >= 18 (see engines).
          node-version: 24
          # DELIBERATELY no registry-url. Setting it makes setup-node write
          # `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}` into an .npmrc,
          # and with no token in the environment that line expands to empty —
          # npm then reads it, concludes auth is already configured, and never
          # starts the OIDC exchange at all. The publish fails as unauthenticated
          # with a trusted publisher sitting there correctly configured.
          # See actions/setup-node#1551. registry.npmjs.org is the default
          # registry anyway, so nothing is lost by omitting it.

      # setup-node pins whatever npm shipped with the Node build; OIDC needs
      # >= 11.5.1, so ask for it explicitly rather than hoping.
      - name: Ensure an npm that speaks OIDC
        run: |
          npm install -g npm@latest
          npm --version

      # Belt and braces for the above: if any step ever reintroduces an
      # _authToken line, strip it rather than let it silently disable OIDC.
      - name: Make sure nothing is pretending to be authenticated
        run: |
          for f in "$HOME/.npmrc" "$NPM_CONFIG_USERCONFIG"; do
            if [ -n "$f" ] && [ -f "$f" ]; then
              sed -i '/_authToken/d' "$f"
              echo "scrubbed _authToken from $f"
            fi
          done
          echo "--- effective auth config ---"
          npm config list | grep -i "registry\|token" || true

      - run: npm ci

      # Browser suites are not optional — several of the verification gates in
      # this package are only exercised against real Chromium.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - run: npm test

      - name: Verify the tarball carries no real host or credential
        run: |
          npm pack --dry-run 2>&1 | tee /tmp/pack.txt
          if grep -qiE 'hypepaper|burningxoul' /tmp/pack.txt; then
            echo "::error::origin-app residue in the tarball"; exit 1
          fi

      # No credential of any kind is referenced here. npm mints a short-lived one
      # for this workflow in this repository from the OIDC token, and attaches a
      # provenance attestation as a side effect.
      - name: Publish
        if: ${{ github.event_name == 'release' }}
        run: npm publish

      # `npm publish --dry-run` is the wrong check here: between releases the
      # committed version is ALREADY on the registry, so it exits 1 with "cannot
      # publish over the previously published versions" and reports a healthy
      # pipeline as broken. Pack instead — it validates exactly what a manual run
      # can validate (files list, tarball contents) without asserting the version
      # is new, which only a release can be expected to satisfy.
      - name: Pack (manual dispatch)
        if: ${{ github.event_name != 'release' }}
        run: |
          npm pack --dry-run
          echo "committed version: $(node -p "require('./package.json').version")"
          echo "on registry:       $(npm view mischief version 2>/dev/null || echo 'not published')"
